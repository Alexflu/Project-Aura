name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -c requirements-lock.txt -r requirements-desktop.txt -r requirements-mcp.txt
      - run: python -m unittest discover -s tests -v
